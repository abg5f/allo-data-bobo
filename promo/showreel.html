<style>html,body{margin:0;background:#111}canvas{display:block;width:100%;max-width:1920px;margin:0 auto}#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><div id="hud"></div>
<script>
'use strict';
/* Showreel 40 s @ 30 fps. Game art (Brutus, commerciaux, données) est chargé depuis ../index.html. */
const W=1920,H=1080,FPS=30,DUR=40;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={bg:'#fff6ea',bg2:'#ffeccf',ink:'#231942',ink2:'#5b5575',v:'#6c4df6',v2:'#8f7bff',vd:'#2b1d73',coral:'#ff5d6c',mint:'#19c39c',sun:'#ffc93c',sky:'#4fb3ff',line:'#e9dfcf',white:'#ffffff'};
const E={
  out:t=>1-Math.pow(1-t,3), in:t=>t*t*t, io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)},
  elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1,
  expo:t=>t>=1?1:1-Math.pow(2,-10*t)
};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a),0,1),mix=(a,b,t)=>a+(b-a)*t;
const h=(i,j=0)=>{const x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x)};
const damp=(x,f=18,k=6)=>x<=0?0:Math.exp(-x*k)*Math.cos(x*f);
const MONO='"Cascadia Mono",Consolas,"Courier New",monospace';
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji"';

function T(s,x,y,size,col,o={}){
  ctx.save();ctx.font=`${o.w||800} ${size}px ${o.f||'"Baloo 2"'}, ${EMO}`;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';
  ctx.letterSpacing=(o.ls||0)+'px';
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(o.shadow){ctx.fillStyle=o.shadow;ctx.fillText(s,x+(o.shx||0),y+(o.sh??size*.08))}
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.sw||size*.12;ctx.strokeStyle=o.stroke;ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();
}
function tw(s,size,o={}){ctx.save();ctx.font=`${o.w||800} ${size}px ${o.f||'"Baloo 2"'}, ${EMO}`;ctx.letterSpacing=(o.ls||0)+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
function rr(x,y,w,hh,r){ctx.beginPath();ctx.roundRect(x,y,w,hh,r)}
function card(x,y,w,hh,r,fill,o={}){
  if(o.shadow!==false){rr(x,y+(o.drop??12),w,hh,r);ctx.fillStyle=o.shadowCol||'rgba(20,10,60,.22)';ctx.fill()}
  rr(x,y,w,hh,r);ctx.fillStyle=fill;ctx.fill();
  if(o.stroke){ctx.lineWidth=o.lw||5;ctx.strokeStyle=o.stroke;ctx.stroke()}
}
function pic(im,cx,by,w,o={}){
  if(!im)return;const hh=w*im.height/im.width;ctx.save();ctx.translate(cx,by);if(o.rot)ctx.rotate(o.rot);
  ctx.scale(o.sx||1,o.sy||1);if(o.alpha!=null)ctx.globalAlpha*=o.alpha;ctx.drawImage(im,-w/2,-hh,w,hh);ctx.restore();
}
function pop(k){return k<=0?0:E.back(Math.min(1,k))}
function bgFill(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
function dots(col,ox,oy,sp,r,alpha){ctx.save();ctx.fillStyle=col;ctx.globalAlpha=alpha;
  const mx=((ox%sp)+sp)%sp,my=((oy%sp)+sp)%sp;
  for(let y=-sp;y<H+sp;y+=sp)for(let x=-sp;x<W+sp;x+=sp){ctx.beginPath();ctx.arc(x+mx,y+my,r,0,7);ctx.fill()}ctx.restore()}
function rays(cx,cy,n,rot,col,alpha,len=2400){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.fillStyle=col;ctx.globalAlpha=alpha;
  for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(0,0);const a=i/n*Math.PI*2,b=a+Math.PI/n;ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.lineTo(Math.cos(b)*len,Math.sin(b)*len);ctx.fill()}ctx.restore()}
function star(x,y,r,col,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const rr2=i%2?r*.38:r;const a=i/8*Math.PI*2;ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}ctx.closePath();ctx.fill();ctx.restore()}
function burst(x,y,k,n,R,cols,seed=1,size=14){if(k<=0||k>=1)return;ctx.save();
  for(let i=0;i<n;i++){const a=h(i,seed)*6.283,d=R*(.5+h(i,seed+1)*.7)*E.out(k);ctx.globalAlpha=1-k;
    star(x+Math.cos(a)*d,y+Math.sin(a)*d+k*k*60,size*(1-k*.6)*(.6+h(i,seed+2)*.8),cols[i%cols.length],k*4+i)}ctx.restore()}
function ringPulse(x,y,k,R,col,lw=10){if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle=col;ctx.lineWidth=lw*(1-k);ctx.beginPath();ctx.arc(x,y,R*E.out(k),0,7);ctx.stroke();ctx.restore()}
function flash(t,a,b,col='#fff',max=.9){const k=seg(t,a,b);if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=(1-k)*max;bgFill(col);ctx.restore()}
function bubble(x,y,w,hh,text,size,k,o={}){if(k<=0)return;ctx.save();ctx.translate(x,y);const s=pop(k);ctx.scale(s,s);
  rr(-w/2,-hh/2+8,w,hh,28);ctx.fillStyle=C.ink;ctx.fill();rr(-w/2,-hh/2,w,hh,28);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=C.ink;ctx.stroke();
  const tx=o.tail??-w*.2;ctx.beginPath();ctx.moveTo(tx-18,hh/2-3);ctx.lineTo(tx+18,hh/2-3);ctx.lineTo(tx+(o.tailDx??-10),hh/2+36);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.moveTo(tx-18,hh/2);ctx.lineTo(tx+(o.tailDx??-10),hh/2+36);ctx.lineTo(tx+18,hh/2);ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.stroke();
  const n=o.typed!=null?Math.floor(text.length*o.typed):text.length;
  T(text.slice(0,n),0,2,size,C.ink);ctx.restore()}
/* letter-by-letter drop in */
function dropWord(word,cx,cy,size,col,t0,t,o={}){
  const ws=[...word].map(ch=>tw(ch,size,o));const total=ws.reduce((a,b)=>a+b,0);let x=cx-total/2;
  [...word].forEach((ch,i)=>{const k=seg(t,t0+i*(o.stag??.06),t0+i*(o.stag??.06)+(o.dur??.45));if(k>0){
    const y=cy-mix(o.from??260,0,E.back(k)),rot=mix((h(i,7)-.5)*.9,0,E.out(k));
    ctx.save();ctx.translate(x+ws[i]/2,y);ctx.rotate(rot+(o.wobble?Math.sin(t*6+i)*.04:0));ctx.globalAlpha=Math.min(1,k*3);
    T(ch,0,0,size,col,{stroke:o.stroke,sw:o.sw,shadow:o.shadow,sh:o.sh});ctx.restore()}
    x+=ws[i]});
}
function camera(fn,zoom=1,cx=W/2,cy=H/2,shx=0,shy=0){ctx.save();ctx.translate(cx+shx,cy+shy);ctx.scale(zoom,zoom);ctx.translate(-cx,-cy);fn();ctx.restore()}
function shake(t,a,b,amp){const k=seg(t,a,b);if(k<=0||k>=1)return [0,0];const s=amp*(1-k);return [(h(Math.floor(t*60),1)-.5)*s,(h(Math.floor(t*60),2)-.5)*s]}

/* ---------------- Game art ---------------- */
let G,IMG={};
const VORDER=['clean','format','phone','civ','source','email','dedup','rgpd','route'];
async function loadGame(){
  const src=await (await fetch('../index.html')).text();
  const a=src.indexOf('/* ================= Utils'),b=src.indexOf('/* ================= UI helpers');
  const code=src.slice(a,b);
  G=new Function(code+';return {makeLead,brutusSVG,salesSVG,LEVELS,ORDER,SALES,SOURCES,STATIONS,PLACES,JUNK};')();
}
function svgImg(svg,w,hh){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);
  i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hh}" `))})}
async function buildArt(){
  const L=G.makeLead(G.LEVELS[7]);
  Object.assign(L.p,{prenom:'Jean-Pierre',nom:'Dupont',g:'M',src:'meta',place:G.PLACES.find(p=>p.v==='Nantes'),
    phone:{c:'fr',sub:'612345678',zero:true,sz:[1,2,2,2,2],code:'+33',nat:'0612345678',intl:'+33 6 12 34 56 78'}});
  IMG.b=[];
  for(let k=0;k<=9;k++){
    const st={p:L.p,level:{st:G.ORDER},done:new Set(VORDER.slice(0,k)),civ:k>=4?'M':null};
    IMG.b[k]=await svgImg(G.brutusSVG(st),800,950);
  }
  IMG.s={};
  for(const z of Object.keys(G.SALES)){IMG.s[z]={wait:await svgImg(G.salesSVG(G.SALES[z],'wait'),600,1000),joy:await svgImg(G.salesSVG(G.SALES[z],'joy'),600,1000)}}
}

/* ================= SCENE 1 : title (0-4) ================= */
const GL=['#','%','@','¤','*','&','§','✨','?','!','~','^','{','}','<','>','|','°'];
function s1(t){
  bgFill(C.ink);
  const ir=seg(t,.85,1.5);
  if(ir>0){ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,E.io(ir)*1250,0,7);ctx.fillStyle=C.v;ctx.fill();ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,E.io(ir)*1250,0,7);ctx.clip();
    rays(W/2,H/2,18,t*.15,'#fff',.06);dots('#fff',t*40,t*20,64,3,.12);ctx.restore()}
  if(t<.5){if(Math.floor(t*8)%2===0)T('#',W/2,H/2,190,C.sun);T('donnée_brute.csv',W/2,H/2+170,34,'#8f86b8',{f:MONO,w:600,alpha:seg(t,0,.2)})}
  // glyph storm
  if(t>=.5){for(let i=0;i<150;i++){
    const a=h(i,1)*6.283,sp=260+h(i,2)*1000;
    const d=sp*E.out(seg(t,.5,1.4))+(t-.5)*45*(h(i,6)+.3);
    const x=W/2+Math.cos(a)*d,y=H/2+Math.sin(a)*d*.62;
    const al=(1-seg(t,1.5,2.3)*.72)*(.45+h(i,4)*.55);
    ctx.save();ctx.translate(x,y);ctx.rotate(t*(h(i,3)-.5)*3+a);ctx.globalAlpha=al;
    T(GL[i%GL.length],0,0,26+h(i,5)*80,[C.coral,C.sun,C.sky,C.mint,'#fff'][i%5]);ctx.restore()}}
  flash(t,.5,.75);
  ringPulse(W/2,H/2,seg(t,.5,1.2),900,C.sun,28);
  // title
  const sh=shake(t,1.0,1.5,26);
  camera(()=>{
    dropWord('ALLÔ',W/2,300,250,C.sun,1.0,t,{stroke:C.ink,sw:22,shadow:C.ink,sh:18,wobble:true});
    dropWord('DATA',W/2,535,250,'#fff',1.25,t,{stroke:C.ink,sw:22,shadow:C.ink,sh:18,wobble:true});
    dropWord('BOBO',W/2,770,250,C.coral,1.5,t,{stroke:C.ink,sw:22,shadow:C.ink,sh:18,wobble:true});
    const pk=seg(t,1.2,1.6);
    if(pk>0){const ring=t>1.4&&t<3.4?Math.sin(t*70)*.22*(Math.floor(t*2)%2?1:.3):0;
      ctx.save();ctx.translate(1350,250);ctx.rotate(ring-.2);ctx.scale(pop(pk),pop(pk));T('📞',0,0,160,'#fff');ctx.restore();
      if(t>1.4&&t<3.4){ctx.save();ctx.strokeStyle=C.sun;ctx.lineWidth=8;ctx.lineCap='round';ctx.globalAlpha=.5+.5*Math.sin(t*20);
        for(const s of [-1,1]){ctx.beginPath();ctx.arc(1350,250,120,s>0?-.7:Math.PI-.5,s>0?-.2:Math.PI+.0);ctx.stroke()}ctx.restore()}}
  },1+seg(t,1,4)*.04,W/2,H/2,sh[0],sh[1]);
  // subtitle typed
  const sub='Le jeu où ta donnée brute devient un lead en or ✨';
  const tk=seg(t,2.3,3.3);
  if(tk>0){const n=Math.floor(sub.length*tk);const w=tw(sub,56,{w:800});
    card(W/2-w/2-40,905,w+80,100,50,C.ink,{shadow:false});
    T(sub.slice(0,n)+(Math.floor(t*6)%2?'':'|'),W/2-w/2,955,56,'#fff',{a:'left'})}
}

/* ================= SCENE 2 : voici Brutus (4-8) ================= */
const TAGS=[
  {s:'jEAN-p#ierre✨',x:880,y:215,ax:1120,ay:420},
  {s:'06.12.34.56.78',x:1600,y:230,ax:1330,ay:470},
  {s:'jp.dupont@gmial.com',x:1580,y:520,ax:1400,ay:600},
  {s:'Civilité : ???',x:1620,y:800,ax:1360,ay:760},
  {s:'Source : ???',x:930,y:880,ax:1050,ay:780},
  {s:'👯 3 doublons',x:560,y:760,ax:980,ay:640}
];
function s2(t){
  const s=t-4;
  bgFill(C.bg);dots('#e6d7bf',s*40,s*25,56,4,1);
  camera(()=>{
    const ck=pop(seg(s,.05,.55));
    ctx.save();ctx.fillStyle=C.sun;ctx.beginPath();ctx.arc(1200,590,390*ck,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.setLineDash([18,16]);ctx.lineDashOffset=-s*60;ctx.beginPath();ctx.arc(1200,590,450*ck,0,7);ctx.stroke();ctx.restore();
    // leader lines + tags
    TAGS.forEach((g,i)=>{const k=seg(s,1.0+i*.25,1.35+i*.25);if(k<=0)return;
      ctx.save();ctx.strokeStyle=C.coral;ctx.lineWidth=5;ctx.setLineDash([12,10]);
      ctx.beginPath();ctx.moveTo(g.ax,g.ay);ctx.lineTo(mix(g.ax,g.x,E.out(k)),mix(g.ay,g.y,E.out(k)));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=C.coral;ctx.beginPath();ctx.arc(g.ax,g.ay,10,0,7);ctx.fill();ctx.restore();
      const w=tw(g.s,46,{f:MONO,w:700})+60;
      ctx.save();ctx.translate(g.x,g.y);ctx.rotate(Math.sin(s*5+i)*.04+(h(i,3)-.5)*.1);ctx.scale(pop(k),pop(k));
      card(-w/2,-42,w,84,42,'#ffe4e6',{stroke:C.coral,lw:5,drop:8,shadowCol:'rgba(180,35,47,.35)'});
      T(g.s,0,2,46,'#b4232f',{f:MONO,w:700});ctx.restore()});
    // Brutus drop
    const fall=seg(s,0,.35);const land=s-.35;
    let y=mix(-200,905,E.in(fall));const sq=damp(land,16,5);
    const sx=1+.28*sq,sy=1-.28*sq;
    if(land>.6)y+=Math.sin(s*6)*6;
    if(land>0){for(let i=0;i<8;i++){const k=seg(land,0,.6);if(k<1){ctx.save();ctx.globalAlpha=1-k;ctx.fillStyle='#d9c9ad';
      const d=(i%2?1:-1)*(80+i*25)*E.out(k);ctx.beginPath();ctx.arc(1200+d,900-k*40,20+k*30,0,7);ctx.fill();ctx.restore()}}}
    pic(IMG.b[0],1200,y,480,{sx,sy:fall<1?1.12:sy});
    // big text
    const k1=seg(s,.35,.6),k2=seg(s,.6,.9);
    if(k1>0){ctx.save();ctx.translate(420,330);const sc=mix(2.6,1,E.out(k1));ctx.scale(sc,sc);ctx.globalAlpha=k1;T('VOICI',0,0,150,C.ink);ctx.restore()}
    if(k2>0){ctx.save();ctx.translate(430,500);const sc=mix(2.6,1,E.out(k2));ctx.scale(sc,sc);ctx.rotate(-.04);ctx.globalAlpha=k2;
      T('BRUTUS.',0,0,200,C.v,{shadow:C.sun,sh:14,stroke:C.ink,sw:14});ctx.restore()}
    const k3=seg(s,.95,1.3);if(k3>0)T('une donnée tout juste arrivée dans le CRM',430,610,40,C.ink2,{alpha:k3,w:700});
  },1+s*.006,1200,590);
  const kc=seg(s,2.75,3.1);
  if(kc>0){const txt='Une donnée brute. Très, très brute.';const w=tw(txt,58);const y=mix(1180,995,E.back(kc));
    card(W/2-w/2-50,y-55,w+100,110,55,C.ink,{shadow:false});T(txt,W/2,y+2,58,'#fff')}
}

/* ================= SCENE 3 : le commercial attend (8-12) ================= */
function s3(t){
  const s=t-8;
  bgFill(C.sun);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.35);ctx.fillStyle='#ffd766';
  for(let i=-12;i<12;i++)ctx.fillRect(-2000,i*140+((s*80)%140),4000,70);ctx.restore();
  // title
  const kt=seg(s,.15,.55);
  T('Pendant ce temps…',W/2,mix(-80,120,E.back(kt)),84,C.ink,{alpha:kt});
  // clock
  const kc=pop(seg(s,.25,.7));
  ctx.save();ctx.translate(560,470);ctx.scale(kc,kc);
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,14,215,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,215,0,7);ctx.fill();ctx.lineWidth=12;ctx.strokeStyle=C.ink;ctx.stroke();
  for(let i=0;i<12;i++){const a=i/12*6.283;ctx.lineWidth=i%3?5:10;ctx.beginPath();ctx.moveTo(Math.cos(a)*170,Math.sin(a)*170);ctx.lineTo(Math.cos(a)*195,Math.sin(a)*195);ctx.stroke()}
  const m=s*7,hr=s*.6;ctx.lineCap='round';
  ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(hr-1.57)*100,Math.sin(hr-1.57)*100);ctx.stroke();
  ctx.strokeStyle=C.coral;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(m-1.57)*160,Math.sin(m-1.57)*160);ctx.stroke();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();ctx.restore();
  // speed lines around clock
  if(s>.7){ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.lineCap='round';for(let i=0;i<6;i++){const a=i/6*6.283+s*2;ctx.globalAlpha=.4;
    ctx.beginPath();ctx.arc(560,470,260+i%2*20,a,a+.3);ctx.stroke()}ctx.restore()}
  // coffee counter
  const cups=[1.0,1.5,2.0,2.5].filter(x=>s>=x).length;
  if(cups>0){const last=[1.0,1.5,2.0,2.5][cups-1];const pk=1+.35*damp(s-last,20,8);
    ctx.save();ctx.translate(560,850);ctx.scale(pk,pk);card(-230,-72,460,144,72,'#fff',{stroke:C.ink,lw:7});
    T('☕',-120,0,90,'#000');T('× '+cups,60,4,96,C.ink);ctx.restore()}
  // commercial
  const ke=seg(s,0,.45);
  const cx=mix(W+300,1380,E.out(ke));
  pic(IMG.s.ouest.wait,cx,1030,440,{sy:1+Math.sin(s*3)*.012});
  card(cx-150,1000,300,60,30,C.ink,{shadow:false});T('Marco · commercial',cx,1031,32,'#fff',{w:700});
  bubble(cx-40,215,640,120,'Il arrive quand, ce lead ?!',48,seg(s,.8,1.1),{typed:seg(s,.9,1.8),tail:120,tailDx:30});
  if(s>2.6){const k=seg(s,2.6,3.3);T('💧',cx+120,mix(300,380,k),70,'#000',{alpha:1-k*.3})}
}

/* ================= SCENE 4 : les 9 étapes (12-30) ================= */
const ST=[
  {k:'clean',ico:'🚿',name:'Nettoyage',tag:'Adieu les caractères parasites',label:'PRÉNOM',col:C.sky,fx:'zap',from:'jE#AN-p✨ier¤re'},
  {k:'format',ico:'💇',name:'Mise en forme',tag:'Prénom, NOM, e-mail : chacun sa règle',label:'IDENTITÉ',col:C.v2,fx:'flip',from:'jEAN-pierre duPONt',to:'Jean-Pierre DUPONT'},
  {k:'phone',ico:'📞',name:"L'indicatif",tag:'Le 0 saute, le +33 débarque',label:'TÉLÉPHONE',col:C.mint,fx:'phone'},
  {k:'civ',ico:'🎩',name:'La civilité',tag:'Monsieur ? Madame ? On ne devine jamais',label:'CIVILITÉ',col:C.coral,fx:'stamp',from:'???',to:'Monsieur'},

  {k:'email',ico:'📧',name:"L'e-mail",tag:'« gmial.com » ? Non merci.',label:'E-MAIL',col:C.sky,fx:'flip',from:'jp.dupont@gmial.com',to:'jp.dupont@gmail.com'},
  {k:'dedup',ico:'👯',name:'Les doublons',tag:'Trois fiches, une seule personne',label:'FICHES CRM',col:C.v2,fx:'dedup'},
  {k:'rgpd',ico:'🛡️',name:'Le consentement',tag:'Daté, sourcé, en règle',label:'CONSENTEMENT',col:C.mint,fx:'stamp',from:'Non vérifié',to:'✓ Oui · tracé'},

      const words=[['ALLÔ',C.sun],['DATA','#fff'],['BOBO',C.coral]];
      const size=190,gap=50;const ws=words.map(w=>tw(w[0],size));const total=ws.reduce((a,b)=>a+b,0)+gap*2;let x=W/2-total/2;
      words.forEach(([w,c],i)=>{dropWord(w,x+ws[i]/2,300,size,c,t0+i*.12,s,{stroke:C.ink,sw:18,shadow:C.ink,sh:14,stag:.035,dur:.4,from:200});x+=ws[i]+gap});
    },1+seg(s,2,5)*.03,W/2,H/2,sh[0],sh[1]);
    const ks=seg(s,2.45,2.8);if(ks>0)T('Brutus, de donnée brute à lead en or',W/2,mix(470,450,E.out(ks)),60,'#fff',{alpha:ks,w:700});
    const kc=seg(s,2.7,3.0);if(kc>0)T('JOUE MAINTENANT 👇',W/2,575,44,C.sun,{alpha:kc,ls:8});

    if(ku>0){const press=s>3.55&&s<3.75?.94:1;ctx.save();ctx.translate(W/2,700);ctx.scale(pop(ku)*press,pop(ku)*press);
      const txt='allo-data-bobo.vercel.app',w=tw(txt,72)+120;card(-w/2,-72,w,144,72,'#fff',{stroke:C.ink,lw:8,drop:14,shadowCol:C.ink});T(txt,0,5,72,C.ink);ctx.restore();
      ringPulse(W/2,700,seg(s,3.6,4.2),700,C.sun,16)}
    // cursor
    const kcur=seg(s,3.0,3.55);
    if(kcur>0){const cx=mix(1500,1080,E.io(kcur)),cy=mix(1000,730,E.io(kcur));ctx.save();ctx.translate(cx,cy);ctx.scale(s>3.55&&s<3.75?.85:1,s>3.55&&s<3.75?.85:1);
      ctx.fillStyle='#fff';ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(16,47);ctx.lineTo(28,72);ctx.lineTo(38,67);ctx.lineTo(26,43);ctx.lineTo(46,42);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}

/* ================= transitions ================= */
function bars(t,tc,cols){const k=seg(t,tc-.25,tc+.25);if(k<=0||k>=1)return;const n=cols.length,bh=H/n;
  for(let i=0;i<n;i++){const kk=cl(k*1.25-i*.05,0,1);const cover=kk<.5?E.io(kk*2):1,leave=kk<.5?0:E.io((kk-.5)*2);
    ctx.fillStyle=cols[i];ctx.fillRect(mix(-W,0,cover)+leave*W,i*bh,W+2,bh+2)}}
function iris(t,tc,col,x,y){const k=seg(t,tc-.3,tc+.3);if(k<=0||k>=1)return;
  const r=k<.5?mix(1400,0,E.io(k*2)):mix(0,1400,E.io((k-.5)*2));ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2,true);ctx.fillStyle=col;ctx.fill('evenodd');ctx.restore()}
function whip(t,tc){const k=seg(t,tc-.2,tc+.2);if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=Math.sin(k*Math.PI)*.95;
  for(let i=0;i<30;i++){ctx.fillStyle=[C.v,C.sun,C.ink,C.coral][i%4];ctx.fillRect(0,h(i,9)*H,W,6+h(i,8)*40)}ctx.restore()}

function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(t<4)s1(t);else if(t<8)s2(t);else if(t<12)s3(t);else if(t<30)s4(t);else if(t<35)s5(t);else s6(t);
  bars(t,4,[C.coral,C.sun,C.mint,C.sky,C.v]);
  iris(t,8,C.ink,1200,420);
  whip(t,12);
  bars(t,30,[C.sun,C.coral,C.v,C.mint,C.sun]);
}
window.render=render;
(async()=>{
  await document.fonts.load('800 100px "Baloo 2"');await document.fonts.load('700 100px "Baloo 2"');await document.fonts.load('700 100px Nunito');

  else render(0);
})();
